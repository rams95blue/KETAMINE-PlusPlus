; KETAMINE++ settings. Everything here can also be changed in the menu.
; Keys are Windows virtual-key codes: 45 = Insert, 112..123 = F1..F12 (119 = F8), 0 = none.

[Menu]
Key=112
Key2=119
; en, zh, ja, ko, ru, de, fr, es, pt; empty = your Windows language
Language=en
; 0 = automatic (from the screen height), otherwise 0.7 to 2.5
Scale=1.000
; KETAMINE++, KETAMINE, Lament, Cenobite, Leviathan, Toxic, Frost, Ember, Mono, Win95, Black Hat, Zero Day,
; Phosphor, Amber CRT, Root Shell, Mainframe, Netrunner, BSOD or Custom (Accent / Highlight below)
Skin=Win95
Accent=#1EF8FF
Highlight=#ECECEC
; Window background opacity, 0.6 to 1
Opacity=1.000

[Toggles]
GodMode=0
InfiniteHealth=0
NoSprintCooldown=0
OneHitKill=0
Invisible=0
InfiniteAmmo=0
NoSufferingCost=0
NoPowerCooldown=0
Unbreakable=0
SilentAim=0
Fly=0
Noclip=0
; Jump on the jump key, and bunny hopping (hold the key)
Jump=1
Bhop=1
FreezeAI=0
HideHUD=0
FreeCam=0
AutoLockpick=0
; 1 = skip the logos and notices at startup
SkipIntros=1
; FOV editor (FOV tab): 1 = your own gameplay FOV
CustomFov=1
; 1 = keep the game's sprint / ladder FOV changes, scaled around your FOV
FovKeepEffects=1
; Game fixes (Fixes tab)
FixToolInput=1
KeypadFix=1
SpeedUp=1
QuickInteract=1
CutsceneSkip=0
Esp=0
EspBox=1
EspHealth=1
EspName=1
EspDistance=1
EspSkeleton=0
EspHead=0
EspChams=0
EspSnaplines=0
EspOffscreen=1
EspItems=1
EspContainers=0
EspSavePoints=0
; Silent aim's circle around the crosshair
EspAimFov=0
; Look straight up and down
UnlockPitch=1
BhopAuto=1
; Hop timing readout near the crosshair
BhopHud=0
; Live horizontal speed under the crosshair
Speedometer=0
FreeCamPauseTime=0
HudAutoHide=1
; Minimap (Minimap tab). Rotate 1 = the way you face points up, 0 = north up
Minimap=0
MinimapRotate=1
MinimapAlways=1
MinimapScreenEdge=0
MinimapFrame=1
PauseMenuEntry=1
SimplePrompts=0
PromptBrackets=1

