JumpKey=32
; 35 = End
CustomFov=35
FovKeepEffects=0
FixToolInput=0
KeypadFix=0
SpeedUp=0
QuickInteract=0
CutsceneSkip=0
; World FOV + / - (33 = Page Up, 34 = Page Down)
FovUp=33
FovDown=34
Esp=0

[Values]
; FOV editor. Degrees, on the game's own camera scale (30 to 150).
WorldFov=120.000
; 0 = arms and held items follow the world FOV
ViewmodelFov=110.000
; 0 = the game's own aiming FOV
AdsFov=90.000
; Seconds to blend between your FOV and the game's (0 to 2)
FovBlend=0.250
; Quick interact: pickup / ladder hold time in seconds (0.1 to 1), ladder animation speed (1 to 3)
InteractHold=0.300
LadderSpeed=1.600
; Bunny hop: speed gain per chained hop in % (0 to 25, a perfect hop doubles it), max hop speed as a multiple of
; walking speed (1 to 4, 0 = unlimited)
BhopGain=10.000
BhopCap=0.000
; Speed up interactions: speed per sequence, 1 = that one off
